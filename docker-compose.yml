version: '3.8'

services:
  ocr-engine:
    container_name: ocr-engine-endpoint
    image: ocr-engine:v1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /data/ocr/source-code/ocr-engine/file_saved:/app/file_saved
      - ./ocrv4:/root/.paddleocr/whl/rec/en/en_PP-OCRv4_rec_infer
      - ./ocrv3:/root/.paddleocr/whl/det/en/en_PP-OCRv3_det_infer
      - ./ppocr:/root/.paddleocr/whl/cls/ch_ppocr_mobile_v2.0_cls_infer

    ports:
      - "8184:8080"
    environment:
      - ENV=development
      - PYTHONPATH=/app
    command: >
      sh -c "
        pip3 install pandas==2.1.4 --index-url=https://nexus.msb.com.vn/repository/pypi/simple && \
        pip3 install numpy==1.26.4 --index-url=https://nexus.msb.com.vn/repository/pypi/simple && \
        uvicorn app.main:app --host 0.0.0.0 --port 8080 --log-config log_config.json"

